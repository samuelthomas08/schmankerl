services:
  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    image: ghcr.io/samuelthomas08/schmankerl-backend:latest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}

  frontend:
    image: ghcr.io/samuelthomas08/schmankerl-frontend:latest
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - default
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.schmankerl.rule=Host(`schmankerl.samuel-thomas.de`)"
      - "traefik.http.routers.schmankerl.entrypoints=websecure"
      - "traefik.http.routers.schmankerl.tls.certresolver=letsencrypt"
      - "traefik.http.services.schmankerl.loadbalancer.server.port=80"

networks:
  proxy:
    external: true

volumes:
  postgres-data:
